<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<rect width="1600" height="900" fill="#fcfcfb" />
<text x="60" y="66" font-size="36" fill="#0b0b0b" font-weight="bold" text-anchor="start">Is acoustic re-identification recognising the animal, or the recording?</text>
<text x="60" y="102" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Four diagnostics applied to 13 public datasets from nine species and seven studies, with BirdNET and 35 other neural networks</text>
<rect x="1180" y="119" width="16" height="16" rx="3" fill="#eb6834" />
<text x="1204" y="132" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">As commonly tested</text>
<rect x="1370" y="119" width="16" height="16" rx="3" fill="#2a78d6" />
<text x="1394" y="132" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Under the diagnostic</text>
<rect x="60" y="150" width="420" height="610" rx="12" fill="#f3f2ee" stroke="#e3e2dc" stroke-width="1.5" />
<text x="84" y="190" font-size="14" fill="#52514e" font-weight="bold" text-anchor="start" letter-spacing="1.5">THE PROBLEM</text>
<text x="84" y="222" font-size="19" fill="#0b0b0b" font-weight="bold" text-anchor="start">Two common practices can inflate</text>
<text x="84" y="246" font-size="19" fill="#0b0b0b" font-weight="bold" text-anchor="start">reported re-ID accuracy</text>
<text x="84" y="290" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="start">a. Each animal is recorded at its own site</text>
<rect x="90" y="308" width="110" height="74" rx="8" fill="#dfe9f5" stroke="#e3e2dc" />
<circle cx="122" cy="345" r="17" fill="#0b0b0b" />
<text x="122" y="351" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">A</text>
<rect x="160" y="330" width="12" height="22" rx="6" fill="#52514e" />
<line x1="166" y1="352" x2="166" y2="362" stroke="#52514e" stroke-width="2" />
<text x="145" y="376" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">site 1</text>
<rect x="215" y="308" width="110" height="74" rx="8" fill="#f5e3d8" stroke="#e3e2dc" />
<circle cx="247" cy="345" r="17" fill="#0b0b0b" />
<text x="247" y="351" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">B</text>
<rect x="285" y="330" width="12" height="22" rx="6" fill="#52514e" />
<line x1="291" y1="352" x2="291" y2="362" stroke="#52514e" stroke-width="2" />
<text x="270" y="376" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">site 2</text>
<rect x="340" y="308" width="110" height="74" rx="8" fill="#dcefe6" stroke="#e3e2dc" />
<circle cx="372" cy="345" r="17" fill="#0b0b0b" />
<text x="372" y="351" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">C</text>
<rect x="410" y="330" width="12" height="22" rx="6" fill="#52514e" />
<line x1="416" y1="352" x2="416" y2="362" stroke="#52514e" stroke-width="2" />
<text x="395" y="376" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">site 3</text>
<text x="84" y="412.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Identity and recording site are linked,</text>
<text x="84" y="431.8" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">so a classifier can score highly by</text>
<text x="84" y="451.6" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">recognising the place.</text>
<text x="84" y="505" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="start">b. Clips are split at random</text>
<text x="84" y="544" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start">Random split</text>
<rect x="184" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="208" y="525" width="20" height="26" rx="4" fill="#0b0b0b" />
<rect x="232" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="256" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="280" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="304" y="525" width="20" height="26" rx="4" fill="#0b0b0b" />
<rect x="328" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="352" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="376" y="525" width="20" height="26" rx="4" fill="#0b0b0b" />
<rect x="400" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="424" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="448" y="525" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<text x="84" y="586" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start">Session split</text>
<rect x="184" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="208" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="232" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="256" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="280" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="304" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="328" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="352" y="567" width="20" height="26" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<rect x="376" y="567" width="20" height="26" rx="4" fill="#0b0b0b" />
<rect x="400" y="567" width="20" height="26" rx="4" fill="#0b0b0b" />
<rect x="424" y="567" width="20" height="26" rx="4" fill="#0b0b0b" />
<rect x="448" y="567" width="20" height="26" rx="4" fill="#0b0b0b" />
<line x1="184" y1="605" x2="276" y2="605" stroke="#8a8984" stroke-width="1.5" />
<text x="230.0" y="622" font-size="12" fill="#8a8984" font-weight="normal" text-anchor="middle">day 1</text>
<line x1="280" y1="605" x2="372" y2="605" stroke="#8a8984" stroke-width="1.5" />
<text x="326.0" y="622" font-size="12" fill="#8a8984" font-weight="normal" text-anchor="middle">day 2</text>
<line x1="376" y1="605" x2="468" y2="605" stroke="#8a8984" stroke-width="1.5" />
<text x="422.0" y="622" font-size="12" fill="#8a8984" font-weight="normal" text-anchor="middle">day 3</text>
<rect x="184" y="637" width="14" height="14" rx="3" fill="#ffffff" stroke="#52514e" stroke-width="1.5" />
<text x="204" y="649" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start">training</text>
<rect x="274" y="637" width="14" height="14" rx="3" fill="#0b0b0b" />
<text x="294" y="649" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start">test</text>
<text x="84" y="681.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Training and test clips share sessions, so the</text>
<text x="84" y="700.8" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">score no longer measures recognising an</text>
<text x="84" y="720.6" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">animal in a new session.</text>
<rect x="510" y="150" width="505" height="297" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="1.5" />
<circle cx="544" cy="186" r="16" fill="#0b0b0b" />
<text x="544" y="192" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="572" y="193" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start">Split by recording session</text>
<text x="534" y="226" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Does accuracy hold in a new recording session?</text>
<text x="534" y="262" font-size="14" fill="#8a8984" font-weight="normal" text-anchor="start">Little owl, BirdNET, same clips and per-bird counts</text>
<line x1="704" y1="272" x2="704" y2="354" stroke="#e9e8e3" stroke-width="1" />
<text x="704" y="372" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">0</text>
<line x1="829.0" y1="272" x2="829.0" y2="354" stroke="#e9e8e3" stroke-width="1" />
<text x="829.0" y="372" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">0.5</text>
<line x1="954.0" y1="272" x2="954.0" y2="354" stroke="#e9e8e3" stroke-width="1" />
<text x="954.0" y="372" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">1</text>
<path d="M704,278 H940.75 Q944.75,278 944.75,282 V300 Q944.75,304 940.75,304 H704 Z" fill="#eb6834" />
<text x="692" y="281" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">Random clips,</text>
<text x="692" y="297" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">mean of 10 seeds</text>
<text x="952.75" y="297" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">0.963</text>
<path d="M704,322 H819.25 Q823.25,322 823.25,326 V344 Q823.25,348 819.25,348 H704 Z" fill="#2a78d6" />
<text x="692" y="333" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">Session split</text>
<text x="831.25" y="341" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">0.477</text>
<text x="534" y="396.0" font-size="15" fill="#0b0b0b" font-weight="normal" text-anchor="start">Mixing clips from the same sessions into training and</text>
<text x="534" y="414.5" font-size="15" fill="#0b0b0b" font-weight="normal" text-anchor="start">test raised accuracy by 0.20 to 0.51 in 18 comparisons</text>
<text x="534" y="433.0" font-size="15" fill="#0b0b0b" font-weight="normal" text-anchor="start">with matched clips, counts and models (three species).</text>
<rect x="1035" y="150" width="505" height="297" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="1.5" />
<circle cx="1069" cy="186" r="16" fill="#0b0b0b" />
<text x="1069" y="192" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="1097" y="193" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start">Take the animal away</text>
<text x="1059" y="226" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Can ambient sound alone identify individuals?</text>
<text x="1059" y="262" font-size="14" fill="#8a8984" font-weight="normal" text-anchor="start">Chiffchaff within one year, BirdNET, balanced accuracy</text>
<line x1="1229" y1="272" x2="1229" y2="354" stroke="#e9e8e3" stroke-width="1" />
<text x="1229" y="372" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">0</text>
<line x1="1354.0" y1="272" x2="1354.0" y2="354" stroke="#e9e8e3" stroke-width="1" />
<text x="1354.0" y="372" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">0.5</text>
<line x1="1479.0" y1="272" x2="1479.0" y2="354" stroke="#e9e8e3" stroke-width="1" />
<text x="1479.0" y="372" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">1</text>
<path d="M1229,278 H1422.75 Q1426.75,278 1426.75,282 V300 Q1426.75,304 1422.75,304 H1229 Z" fill="#eb6834" />
<text x="1217" y="289" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">Song</text>
<text x="1434.75" y="297" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">0.791</text>
<path d="M1229,322 H1403.5 Q1407.5,322 1407.5,326 V344 Q1407.5,348 1403.5,348 H1229 Z" fill="#2a78d6" />
<text x="1217" y="325" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">Ambient sound,</text>
<text x="1217" y="341" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">no bird calling</text>
<text x="1415.5" y="341" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">0.714</text>
<text x="1059" y="400.0" font-size="15" fill="#0b0b0b" font-weight="normal" text-anchor="start">Background alone identified the birds for</text>
<text x="1059" y="419.8" font-size="15" fill="#0b0b0b" font-weight="normal" text-anchor="start">35 of 38 embeddings and controls.</text>
<rect x="510" y="463" width="505" height="297" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="1.5" />
<circle cx="544" cy="499" r="16" fill="#0b0b0b" />
<text x="544" y="505" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="572" y="506" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start">Hold the recording fixed</text>
<text x="534" y="539" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Where animals share a microphone, does re-ID survive?</text>
<circle cx="554" cy="581" r="14" fill="#2a78d6" />
<path d="M547,581 l5,5 l9,-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="580" y="586" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">Zebra finches, group of 4</text>
<text x="810" y="586" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">identity signal beyond recording</text>
<circle cx="554" cy="623" r="13" fill="#ffffff" stroke="#8a8984" stroke-width="2" />
<text x="554" y="629" font-size="16" fill="#8a8984" font-weight="bold" text-anchor="middle">?</text>
<text x="580" y="628" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">Zebra finches, group of 8</text>
<text x="810" y="628" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">recording not ruled out</text>
<circle cx="554" cy="665" r="13" fill="#ffffff" stroke="#8a8984" stroke-width="2" />
<text x="554" y="671" font-size="16" fill="#8a8984" font-weight="bold" text-anchor="middle">?</text>
<text x="580" y="670" font-size="16" fill="#0b0b0b" font-weight="normal" text-anchor="start">Rooks, one aviary</text>
<text x="810" y="670" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">recording not ruled out</text>
<text x="534" y="706" font-size="14" fill="#0b0b0b" font-weight="normal" text-anchor="start">Only one dataset gave clear evidence beyond recording.</text>
<text x="534" y="725" font-size="14" fill="#0b0b0b" font-weight="normal" text-anchor="start">Both finch groups lack cross-recording same-bird pairs</text>
<rect x="1035" y="463" width="505" height="297" rx="12" fill="#ffffff" stroke="#e3e2dc" stroke-width="1.5" />
<circle cx="1069" cy="499" r="16" fill="#0b0b0b" />
<text x="1069" y="505" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="1097" y="506" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start">Let strangers in</text>
<text x="1059" y="539" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start">Are known animals still named when others call?</text>
<text x="1059" y="575" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="start">Little owl · Perch 2.0 · nearest clip · four enrolled birds</text>
<line x1="1229" y1="585" x2="1229" y2="667" stroke="#e9e8e3" stroke-width="1" />
<text x="1229" y="685" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">0</text>
<line x1="1354.0" y1="585" x2="1354.0" y2="667" stroke="#e9e8e3" stroke-width="1" />
<text x="1354.0" y="685" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">0.5</text>
<line x1="1479.0" y1="585" x2="1479.0" y2="667" stroke="#e9e8e3" stroke-width="1" />
<text x="1479.0" y="685" font-size="13" fill="#8a8984" font-weight="normal" text-anchor="middle">1</text>
<path d="M1229,591 H1415.0 Q1419.0,591 1419.0,595 V613 Q1419.0,617 1415.0,617 H1229 Z" fill="#eb6834" />
<text x="1217" y="602" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">Before rejection</text>
<text x="1427.0" y="610" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">0.760</text>
<path d="M1229,635 H1340.5 Q1344.5,635 1344.5,639 V657 Q1344.5,661 1340.5,661 H1229 Z" fill="#2a78d6" />
<text x="1217" y="638" font-size="15" fill="#52514e" font-weight="normal" text-anchor="end">After rejection,</text>
<text x="1217" y="654" font-size="13" fill="#52514e" font-weight="normal" text-anchor="end">10% stranger target</text>
<text x="1352.5" y="654" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">0.462</text>
<text x="1059" y="706" font-size="14" fill="#0b0b0b" font-weight="normal" text-anchor="start">Highest median in wild session-split tests: 46%,</text>
<text x="1059" y="725" font-size="14" fill="#0b0b0b" font-weight="normal" text-anchor="start">across 36 networks and two scorers; 16 role allocations.</text>
<rect x="60" y="782" width="1480" height="78" rx="12" fill="#0b0b0b" />
<text x="84" y="815" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="start">Accuracy reported without these four diagnostics can substantially overstate acoustic re-ID.</text>
<text x="84" y="842" font-size="17" fill="#d9d8d2" font-weight="normal" text-anchor="start">No new models are needed; each diagnostic requires suitable data. Test before planning population monitoring.</text>
<text x="1540" y="886" font-size="12" fill="#8a8984" font-weight="normal" text-anchor="end">Wallington &amp; Lighten (2026), author manuscript v10. CC BY-NC 4.0</text>
<text x="534" y="744" font-size="14" fill="#52514e" text-anchor="start">within seven days; changes over time remain a confound.</text><text x="1059" y="744" font-size="13" fill="#52514e" text-anchor="start">Known calls accepted and correctly named; stranger rates can exceed 10%.</text></svg>